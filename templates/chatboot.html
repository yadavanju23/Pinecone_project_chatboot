<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Chatbot</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="bot">
        <div class="info">
            <h3>Personal Chatbot</h3>
            <span>Ask me anything!</span>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chat-box">
        <div class="message bot">Hello! How can I help you?</div>
    </div>

    <!-- Input -->
    <div class="chat-input">
        <input type="text" id="message" placeholder="Type your message...">
<button id="send-btn">➤</button>
    </div>

</div>

<!-- ✅ JavaScript -->
<script>
const sendBtn = document.getElementById("send-btn");
const inputField = document.getElementById("message");
const chatBox = document.getElementById("chat-box");

sendBtn.addEventListener("click", sendMessage);

inputField.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});

async function sendMessage() {

    const message = inputField.value.trim();

    if (message === "") return;

    // User message
    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.innerText = message;
    chatBox.appendChild(userDiv);

    inputField.value = "";

    // Bot loading
    const botDiv = document.createElement("div");
    botDiv.className = "message bot";
    botDiv.innerText = "Typing...";
    chatBox.appendChild(botDiv);

    chatBox.scrollTop = chatBox.scrollHeight;

    try {

        const response = await fetch("/get", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: `msg=${encodeURIComponent(message)}`
        });

        const data = await response.text();

        botDiv.innerText = data;

    } catch (error) {

        botDiv.innerText = "Error connecting to server.";

        console.log(error);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>


</body>
</html>
